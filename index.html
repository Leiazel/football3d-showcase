<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Football 3D Studio — Galería 360°</title>
  <style>
    :root {
      --bg-panel: rgba(251, 247, 240, 0.88);
      --bg-panel-solid: #fbf7f0;
      --bg-item: rgba(120, 92, 74, 0.07);
      --bg-item-hover: rgba(185, 28, 28, 0.09);
      --border: rgba(120, 88, 68, 0.20);
      --accent: #b91c1c;
      --accent-bright: #dc2626;
      --accent-soft: rgba(185, 28, 28, 0.13);
      --sand: #d6c5ae;
      --text: #241815;
      --muted: #6e5a50;
      --shadow: 0 12px 32px rgba(48, 24, 18, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 52% 38%, #f7f1e6 0%, #e4d6c2 68%, #d2bfa6 100%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 260px;
      cursor: grab;
      touch-action: none;
    }
    #stage:active { cursor: grabbing; }

    #view-canvas {
      width: min(76vh, calc(100vw - 320px));
      height: min(76vh, calc(100vw - 320px));
      max-width: 720px;
      max-height: 720px;
      pointer-events: none;
      filter: drop-shadow(0 24px 44px rgba(45, 20, 14, 0.28));
    }

    .hud { transition: opacity 0.25s ease, transform 0.25s ease; }
    body.clean-mode .hud { opacity: 0; pointer-events: none; }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 20;
    }

    .brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 11px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
    }

    .brand-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-bright), #7f1d1d);
      box-shadow: 0 0 10px rgba(185, 28, 28, 0.5);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--text);
      line-height: 1.2;
    }

    .brand span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      display: block;
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      border-color: rgba(185, 28, 28, 0.55);
      transform: translateY(-1px);
    }
    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fdf8f3;
    }

    /* Sidebar (Desktop) */
    .sidebar {
      position: fixed;
      left: 16px; top: 80px; bottom: 16px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      z-index: 15;
    }

    .panel {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--muted);
      font-weight: 700;
    }

    .model-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 290px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .model-list::-webkit-scrollbar { width: 5px; height: 5px; }
    .model-list::-webkit-scrollbar-thumb { background: rgba(120, 88, 68, 0.35); border-radius: 99px; }

    .model-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      background: var(--bg-item);
      border: 1px solid transparent;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      transition: all 0.12s ease;
    }
    .model-item:hover { background: var(--bg-item-hover); }
    .model-item.active {
      background: var(--accent-soft);
      border-color: rgba(185, 28, 28, 0.55);
      color: #7f1d1d;
      font-weight: 700;
    }
    .model-item small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }
    .model-item.active small { color: #991b1b; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .chip {
      padding: 7px 8px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      background: var(--bg-item);
      border: 1px solid var(--border);
      color: var(--text);
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: rgba(185, 28, 28, 0.5); }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fdf8f3;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .slider-row header {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .stats {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .stats strong { color: var(--text); }

    .hint-pill {
      position: fixed;
      right: 16px; bottom: 16px;
      z-index: 15;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 11.5px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    .hint-pill kbd {
      background: rgba(185, 28, 28, 0.12);
      color: #881313;
      padding: 2px 6px;
      border-radius: 5px;
      font-family: inherit;
      font-weight: 700;
    }

    .loader-pill {
      position: fixed;
      top: 76px; right: 16px;
      z-index: 25;
      background: var(--bg-panel-solid);
      border: 1px solid rgba(185, 28, 28, 0.45);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      box-shadow: var(--shadow);
      display: none;
    }
    .loader-pill.visible { display: block; }

    /* Botón ajustes solo visible en mobile */
    #btn-mobile-drawer { display: none; }
    .mobile-sheet-header { display: none; }

    /* ===================== MOBILE RESPONSIVE ===================== */
    @media (max-width: 860px) {
      html, body {
        overflow: hidden;
      }

      .topbar {
        top: 10px; left: 10px; right: 10px;
        flex-wrap: nowrap;
        gap: 8px;
      }

      .brand {
        padding: 7px 10px;
        border-radius: 12px;
        min-width: 0;
        flex: 1;
        gap: 8px;
      }
      .brand h1 {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand span {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .top-actions {
        flex-wrap: nowrap;
        gap: 5px;
      }

      .btn {
        padding: 8px 9px;
        font-size: 11.5px;
        border-radius: 10px;
      }

      /* Ocultamos "Modo Limpio (H)" y texto largo en mobile para que no sature */
      #btn-clean { display: none; }
      #btn-mobile-drawer { display: inline-flex; padding: 8px 10px; }
      .btn .btn-label-desktop { display: none; }

      /* El escenario ocupa la parte superior/central libre */
      #stage {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        bottom: 124px;
        height: auto;
        padding-left: 0;
      }

      #view-canvas {
        width: min(88vw, 54vh);
        height: min(88vw, 54vh);
      }

      /* Sidebar pasa a ser una barra inferior con carrusel horizontal de jugadores + panel desplegable de ajustes */
      .sidebar {
        position: fixed;
        left: 0; right: 0; top: auto; bottom: 0;
        width: 100%;
        gap: 0;
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
        background: transparent;
      }

      .panel-players {
        padding: 10px 12px;
        border-radius: 16px;
        gap: 8px;
      }

      .model-list {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        max-height: none;
        padding-right: 0;
        padding-bottom: 2px;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .model-item {
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 8px 12px;
        min-width: 122px;
      }

      /* El panel de controles en mobile es un drawer desplegable */
      .panel-controls {
        position: fixed;
        left: 10px; right: 10px;
        bottom: calc(116px + env(safe-area-inset-bottom));
        z-index: 30;
        max-height: 58vh;
        overflow-y: auto;
        display: none;
      }
      .panel-controls.open {
        display: flex;
      }

      .mobile-sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
      .mobile-close {
        appearance: none;
        border: none;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .hint-pill { display: none; }

      .loader-pill {
        top: 66px; right: 12px;
        font-size: 11px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="stage">
    <canvas id="view-canvas" width="512" height="512"></canvas>
  </div>

  <div class="loader-pill" id="loader-pill">Cargando modelo...</div>

  <div class="topbar hud">
    <div class="brand">
      <div class="brand-dot"></div>
      <div style="min-width:0;">
        <h1>Football 3D Studio</h1>
        <span id="active-name">Cargando catálogo...</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn active" id="btn-rotate" title="Activar/Pausar giro automático (Espacio)">⟳ <span class="btn-label-desktop">Auto-Giro</span></button>
      <button class="btn active" id="btn-smooth" title="Alternar entre Suavizado y Malla Original (Tecla S)">✦ <span class="btn-label-desktop">Suavizado</span></button>
      <button class="btn" id="btn-wire" title="Ver topología Wireframe (Tecla W)">◈ <span class="btn-label-desktop">Wireframe</span></button>
      <button class="btn" id="btn-mobile-drawer" title="Vistas y fondos">⚙ Ajustes</button>
      <button class="btn" id="btn-clean" title="Ocultar interfaz (Tecla H)">🎬 Modo Limpio (H)</button>
    </div>
  </div>

  <aside class="sidebar hud">
    <div class="panel panel-players">
      <div class="panel-title">Jugadores (11)</div>
      <div class="model-list" id="model-list"></div>
    </div>

    <div class="panel panel-controls" id="panel-controls">
      <div class="mobile-sheet-header">
        <span class="panel-title">Opciones de vista</span>
        <button class="mobile-close" id="btn-close-drawer">Cerrar</button>
      </div>

      <div class="panel-title">Ángulo de vista</div>
      <div class="grid-4">
        <button class="chip" data-angle="0">Frente</button>
        <button class="chip" data-angle="18">Izq</button>
        <button class="chip" data-angle="6">Der</button>
        <button class="chip" data-angle="12">Atrás</button>
      </div>

      <div class="panel-title" style="margin-top:4px;">Fondo de estudio</div>
      <div class="grid-2">
        <button class="chip active" data-bg="beige">Beige Estudio</button>
        <button class="chip" data-bg="crimson">Rojo Oscuro</button>
        <button class="chip" data-bg="charcoal">Carbón Cálido</button>
        <button class="chip" data-bg="chroma">Chroma Verde</button>
      </div>

      <div class="slider-row" style="margin-top:4px;">
        <header><span>Velocidad de giro</span><span id="speed-val">1.0x</span></header>
        <input type="range" id="rotate-speed" min="0.2" max="3.0" step="0.2" value="1.0" />
      </div>

      <div class="stats" id="mesh-stats">
        <strong>Seleccioná un jugador</strong>
      </div>
    </div>
  </aside>

  <div class="hint-pill hud">
    Arrastrá para girar 360° · <kbd>S</kbd> Suavizado · <kbd>W</kbd> Wireframe · <kbd>H</kbd> Modo Limpio
  </div>

  <script>
    const canvas = document.getElementById('view-canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const loaderPill = document.getElementById('loader-pill');

    let players = [];
    let currentIndex = 0;
    let currentFrame = 0; // 0..23
    let smoothMode = true;
    let wireMode = false;
    let autoRotate = true;
    let rotateSpeed = 1.0;
    let currentBg = 'beige';

    const sheetCache = {};

    function getActiveModeKey() {
      if (wireMode) return 'wire';
      return smoothMode ? 'smooth' : 'flat';
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function ensurePlayerLoaded(player) {
      if (sheetCache[player.slug]) return sheetCache[player.slug];
      loaderPill.classList.add('visible');
      const base = `assets/players/${player.slug}`;
      const [smooth, flat, wire] = await Promise.all([
        loadImage(`${base}/smooth.webp`),
        loadImage(`${base}/flat.webp`),
        loadImage(`${base}/wire.webp`),
      ]);
      sheetCache[player.slug] = { smooth, flat, wire };
      loaderPill.classList.remove('visible');
      return sheetCache[player.slug];
    }

    function drawCurrentFrame() {
      const p = players[currentIndex];
      if (!p) return;
      const sheets = sheetCache[p.slug];
      if (!sheets) return;

      const sheet = sheets[getActiveModeKey()];
      if (!sheet) return;

      const cols = p.cols || 4;
      const cell = p.cell || 512;
      const frameIdx = Math.floor(currentFrame);
      const f = ((frameIdx % p.frames) + p.frames) % p.frames;
      const col = f % cols;
      const row = Math.floor(f / cols);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sheet, col * cell, row * cell, cell, cell, 0, 0, canvas.width, canvas.height);

      // Marca de agua sutil
      ctx.save();
      ctx.font = '600 11px Inter, system-ui, sans-serif';
      ctx.fillStyle = currentBg === 'beige' ? 'rgba(36, 24, 21, 0.22)' : 'rgba(253, 248, 243, 0.24)';
      ctx.textAlign = 'right';
      ctx.fillText('Football 3D Studio', canvas.width - 14, canvas.height - 12);
      ctx.restore();
    }

    async function selectPlayer(index) {
      if (index < 0 || index >= players.length) return;
      currentIndex = index;
      const p = players[index];
      renderPlayerList();
      document.getElementById('active-name').textContent = p.name;
      document.getElementById('mesh-stats').innerHTML =
        `<strong>${p.name}</strong><br/>Vértices: ${p.verts.toLocaleString()}<br/>Triángulos: ${p.tris.toLocaleString()}<br/><span>Vista interactiva 360° · Hunyuan3D 2.0</span>`;
      await ensurePlayerLoaded(p);
      drawCurrentFrame();
    }

    function renderPlayerList() {
      const list = document.getElementById('model-list');
      list.innerHTML = '';
      players.forEach((p, idx) => {
        const el = document.createElement('div');
        el.className = 'model-item' + (idx === currentIndex ? ' active' : '');
        el.innerHTML = `<span>${p.name}</span><small>${(p.tris / 1000).toFixed(0)}k tris</small>`;
        el.onclick = () => selectPlayer(idx);
        list.appendChild(el);
      });
    }

    // Interacción drag 360° (mouse y touch) — arrastrar a la derecha gira hacia la derecha
    let isDragging = false;
    let dragStartX = 0;
    let dragStartFrame = 0;

    stage.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartFrame = currentFrame;
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const sensitivity = window.innerWidth <= 860 ? 12 : 16;
      const deltaFrames = -dx / sensitivity;
      currentFrame = ((dragStartFrame + deltaFrames) % 24 + 24) % 24;
      drawCurrentFrame();
    });

    stage.addEventListener('pointerup', () => { isDragging = false; });
    stage.addEventListener('pointercancel', () => { isDragging = false; });

    // Botones superiores
    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.onclick = () => {
      autoRotate = !autoRotate;
      btnRotate.classList.toggle('active', autoRotate);
    };

    const btnSmooth = document.getElementById('btn-smooth');
    btnSmooth.onclick = () => {
      smoothMode = !smoothMode;
      btnSmooth.classList.toggle('active', smoothMode);
      drawCurrentFrame();
    };

    const btnWire = document.getElementById('btn-wire');
    btnWire.onclick = () => {
      wireMode = !wireMode;
      btnWire.classList.toggle('active', wireMode);
      drawCurrentFrame();
    };

    document.getElementById('btn-clean').onclick = () => {
      document.body.classList.toggle('clean-mode');
    };

    // Drawer mobile
    const panelControls = document.getElementById('panel-controls');
    const btnMobileDrawer = document.getElementById('btn-mobile-drawer');
    btnMobileDrawer.onclick = () => {
      const open = panelControls.classList.toggle('open');
      btnMobileDrawer.classList.toggle('active', open);
    };
    document.getElementById('btn-close-drawer').onclick = () => {
      panelControls.classList.remove('open');
      btnMobileDrawer.classList.remove('active');
    };

    document.getElementById('rotate-speed').oninput = (e) => {
      rotateSpeed = parseFloat(e.target.value);
      document.getElementById('speed-val').textContent = `${rotateSpeed.toFixed(1)}x`;
    };

    document.querySelectorAll('[data-angle]').forEach((btn) => {
      btn.onclick = () => {
        currentFrame = parseInt(btn.dataset.angle, 10);
        drawCurrentFrame();
      };
    });

    const bgStyles = {
      beige: 'radial-gradient(circle at 52% 38%, #f7f1e6 0%, #e4d6c2 68%, #d2bfa6 100%)',
      crimson: 'radial-gradient(circle at 50% 35%, #5c1820 0%, #2a0a0e 72%, #170507 100%)',
      charcoal: 'radial-gradient(circle at 50% 35%, #332924 0%, #1c1613 78%)',
      chroma: '#00b140',
    };

    document.querySelectorAll('[data-bg]').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('[data-bg]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentBg = btn.dataset.bg;
        document.body.style.background = bgStyles[currentBg];
        drawCurrentFrame();
      };
    });

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') document.body.classList.toggle('clean-mode');
      if (e.key.toLowerCase() === 's') btnSmooth.click();
      if (e.key.toLowerCase() === 'w') btnWire.click();
      if (e.code === 'Space') {
        e.preventDefault();
        btnRotate.click();
      }
    });

    let lastTime = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (autoRotate && !isDragging && players.length > 0) {
        currentFrame = ((currentFrame - dt * 5.5 * rotateSpeed) % 24 + 24) % 24;
        drawCurrentFrame();
      }
    }

    fetch('players.json')
      .then((r) => r.json())
      .then(async (data) => {
        players = data;
        if (players.length > 0) {
          await selectPlayer(0);
        }
        requestAnimationFrame(tick);
      });
  </script>
</body>
</html>
