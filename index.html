<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football 3D Studio — Visor 360° Protegido</title>
  <style>
    :root {
      --bg-panel: rgba(13, 18, 30, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 75%);
      user-select: none; -webkit-user-select: none;
    }
    #stage {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      cursor: grab;
    }
    #stage:active { cursor: grabbing; }
    #view-canvas {
      width: min(78vh, 88vw);
      height: min(78vh, 88vw);
      max-width: 720px; max-height: 720px;
      pointer-events: none;
      filter: drop-shadow(0 28px 50px rgba(0, 0, 0, 0.55));
    }

    .hud { transition: opacity 0.25s ease; }
    body.clean-mode .hud { opacity: 0; pointer-events: none; }

    .topbar {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none; z-index: 10;
    }
    .brand {
      pointer-events: auto;
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-panel); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 16px;
    }
    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--accent);
    }
    .brand h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
    .brand span { font-size: 12px; color: var(--muted); font-weight: 500; }
    .badge-lock {
      font-size: 10.5px; font-weight: 700; color: #86efac;
      background: rgba(34, 197, 94, 0.14); border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 3px 8px; border-radius: 999px; margin-left: 6px;
    }

    .top-actions {
      pointer-events: auto;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .btn {
      appearance: none; border: 1px solid var(--border);
      background: var(--bg-panel); backdrop-filter: blur(12px);
      color: var(--text); font-size: 12.5px; font-weight: 600;
      padding: 9px 14px; border-radius: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: rgba(56, 189, 248, 0.55); transform: translateY(-1px); }
    .btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent); color: #e0f2fe;
    }

    .sidebar {
      position: fixed; left: 16px; top: 76px; bottom: 16px; width: 280px;
      display: flex; flex-direction: column; gap: 12px;
      pointer-events: none; z-index: 10;
    }
    .panel {
      pointer-events: auto;
      background: var(--bg-panel); backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .panel-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.9px;
      color: var(--muted); font-weight: 700;
    }
    .model-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 280px; overflow-y: auto; padding-right: 4px;
    }
    .model-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 11px; border-radius: 10px; cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent; font-size: 12.5px; font-weight: 500;
      transition: all 0.12s ease;
    }
    .model-item:hover { background: rgba(255, 255, 255, 0.08); }
    .model-item.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.55);
      font-weight: 700;
    }
    .model-item small { color: var(--muted); font-size: 11px; font-weight: 500; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .chip {
      padding: 7px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 600;
      text-align: center; cursor: pointer;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
      color: var(--text);
    }
    .chip:hover { border-color: rgba(56, 189, 248, 0.5); }
    .chip.active { background: rgba(56, 189, 248, 0.22); border-color: var(--accent); }

    .slider-row {
      display: flex; flex-direction: column; gap: 4px; font-size: 12px;
    }
    .slider-row header {
      display: flex; justify-content: space-between; color: var(--muted);
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .stats {
      font-size: 11.5px; color: var(--muted); line-height: 1.5;
      border-top: 1px solid var(--border); padding-top: 8px;
    }
    .stats strong { color: var(--text); }

    .hint-pill {
      position: fixed; right: 16px; bottom: 16px; z-index: 10;
      background: var(--bg-panel); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 999px; font-size: 11.5px; color: var(--muted);
    }
    .hint-pill kbd {
      background: rgba(255, 255, 255, 0.12); color: var(--text);
      padding: 2px 6px; border-radius: 5px; font-family: inherit; font-weight: 600;
    }
    .loader-pill {
      position: fixed; top: 82px; right: 16px; z-index: 20;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 8px 14px; border-radius: 12px; font-size: 12px; color: #e0f2fe;
      display: none;
    }
    .loader-pill.visible { display: block; }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="stage">
    <canvas id="view-canvas" width="512" height="512"></canvas>
  </div>

  <div class="loader-pill" id="loader-pill">Cargando vistas 360°...</div>

  <div class="topbar hud">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>Football 3D Studio <span class="badge-lock">🔒 360° Sin .GLB expuesto</span></h1>
        <span id="active-name">Cargando catálogo...</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn active" id="btn-rotate">⟳ Auto-Giro</button>
      <button class="btn active" id="btn-smooth" title="Alternar entre Suavizado PBR y Malla Original (Tecla S)">✦ Suavizado</button>
      <button class="btn" id="btn-wire" title="Ver topología Wireframe (Tecla W)">◈ Wireframe</button>
      <button class="btn" id="btn-showreel" title="Graba automáticamente un video 360° de todos los jugadores">🎥 Grabar Showreel</button>
      <button class="btn" id="btn-clean" title="Ocultar interfaz para grabar video (Tecla H)">🎬 Modo Video (H)</button>
    </div>
  </div>

  <aside class="sidebar hud">
    <div class="panel">
      <div class="panel-title">Jugadores disponibles (11)</div>
      <div class="model-list" id="model-list"></div>
    </div>

    <div class="panel">
      <div class="panel-title">Ángulo de vista</div>
      <div class="grid-4">
        <button class="chip" data-angle="0">Frente</button>
        <button class="chip" data-angle="18">Izq</button>
        <button class="chip" data-angle="6">Der</button>
        <button class="chip" data-angle="12">Atrás</button>
      </div>

      <div class="panel-title" style="margin-top:4px;">Fondo de estudio</div>
      <div class="grid-2">
        <button class="chip active" data-bg="studio">Estudio Oscuro</button>
        <button class="chip" data-bg="light">Estudio Claro</button>
        <button class="chip" data-bg="pitch">Cancha</button>
        <button class="chip" data-bg="chroma">Chroma Verde</button>
      </div>

      <div class="slider-row" style="margin-top:4px;">
        <header><span>Velocidad de giro</span><span id="speed-val">1.0x</span></header>
        <input type="range" id="rotate-speed" min="0.2" max="3.0" step="0.2" value="1.0" />
      </div>

      <div class="stats" id="mesh-stats">
        <strong>Seleccioná un jugador</strong>
      </div>
    </div>
  </aside>

  <div class="hint-pill hud">
    Arrastrá con el mouse para girar 360° · <kbd>S</kbd> Suavizado · <kbd>W</kbd> Wireframe · <kbd>H</kbd> Modo Video
  </div>

  <script>
    const canvas = document.getElementById('view-canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const loaderPill = document.getElementById('loader-pill');

    let players = [];
    let currentIndex = 0;
    let currentFrame = 0; // 0..23
    let smoothMode = true;
    let wireMode = false;
    let autoRotate = true;
    let rotateSpeed = 1.0;
    let currentBg = 'studio';

    // Cache de imágenes por jugador: cache[slug] = { smooth: Image, flat: Image, wire: Image }
    const sheetCache = {};

    function getActiveModeKey() {
      if (wireMode) return 'wire';
      return smoothMode ? 'smooth' : 'flat';
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function ensurePlayerLoaded(player) {
      if (sheetCache[player.slug]) return sheetCache[player.slug];
      loaderPill.classList.add('visible');
      const base = `assets/players/${player.slug}`;
      const [smooth, flat, wire] = await Promise.all([
        loadImage(`${base}/smooth.webp`),
        loadImage(`${base}/flat.webp`),
        loadImage(`${base}/wire.webp`),
      ]);
      sheetCache[player.slug] = { smooth, flat, wire };
      loaderPill.classList.remove('visible');
      return sheetCache[player.slug];
    }

    function drawCurrentFrame(targetCtx = ctx, w = canvas.width, h = canvas.height, frameIdx = Math.floor(currentFrame) % 24, modeOverride = null) {
      const p = players[currentIndex];
      if (!p) return;
      const sheets = sheetCache[p.slug];
      if (!sheets) return;

      const modeKey = modeOverride || getActiveModeKey();
      const sheet = sheets[modeKey];
      if (!sheet) return;

      const cols = p.cols || 4;
      const cell = p.cell || 512;
      const f = ((frameIdx % p.frames) + p.frames) % p.frames;
      const col = f % cols;
      const row = Math.floor(f / cols);

      targetCtx.clearRect(0, 0, w, h);
      targetCtx.drawImage(sheet, col * cell, row * cell, cell, cell, 0, 0, w, h);

      // Marca de agua sutil anti-captura en esquina inferior derecha del frame
      targetCtx.save();
      targetCtx.font = '600 11px Inter, system-ui, sans-serif';
      targetCtx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      targetCtx.textAlign = 'right';
      targetCtx.fillText('Football 3D Studio · Preview 360°', w - 14, h - 12);
      targetCtx.restore();
    }

    async function selectPlayer(index) {
      if (index < 0 || index >= players.length) return;
      currentIndex = index;
      const p = players[index];
      renderPlayerList();
      document.getElementById('active-name').textContent = p.name;
      document.getElementById('mesh-stats').innerHTML =
        `<strong>${p.name}</strong><br/>Vértices: ${p.verts.toLocaleString()}<br/>Triángulos: ${p.tris.toLocaleString()}<br/><span style="color:#86efac;">Archivo .GLB protegido (solo vista 360°)</span>`;
      await ensurePlayerLoaded(p);
      drawCurrentFrame();
    }

    function renderPlayerList() {
      const list = document.getElementById('model-list');
      list.innerHTML = '';
      players.forEach((p, idx) => {
        const el = document.createElement('div');
        el.className = 'model-item' + (idx === currentIndex ? ' active' : '');
        el.innerHTML = `<span>${p.name}</span><small>${(p.tris / 1000).toFixed(0)}k tris</small>`;
        el.onclick = () => selectPlayer(idx);
        list.appendChild(el);
      });
    }

    // Interacción drag 360° (mouse y touch)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartFrame = 0;

    stage.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartFrame = currentFrame;
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const deltaFrames = dx / 18;
      currentFrame = (dragStartFrame + deltaFrames % 24 + 24) % 24;
      drawCurrentFrame();
    });

    stage.addEventListener('pointerup', () => { isDragging = false; });
    stage.addEventListener('pointercancel', () => { isDragging = false; });

    // Botones superiores
    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.onclick = () => {
      autoRotate = !autoRotate;
      btnRotate.classList.toggle('active', autoRotate);
    };

    const btnSmooth = document.getElementById('btn-smooth');
    btnSmooth.onclick = () => {
      smoothMode = !smoothMode;
      btnSmooth.classList.toggle('active', smoothMode);
      drawCurrentFrame();
    };

    const btnWire = document.getElementById('btn-wire');
    btnWire.onclick = () => {
      wireMode = !wireMode;
      btnWire.classList.toggle('active', wireMode);
      drawCurrentFrame();
    };

    document.getElementById('btn-clean').onclick = () => {
      document.body.classList.toggle('clean-mode');
    };

    document.getElementById('rotate-speed').oninput = (e) => {
      rotateSpeed = parseFloat(e.target.value);
      document.getElementById('speed-val').textContent = `${rotateSpeed.toFixed(1)}x`;
    };

    document.querySelectorAll('[data-angle]').forEach((btn) => {
      btn.onclick = () => {
        currentFrame = parseInt(btn.dataset.angle, 10);
        drawCurrentFrame();
      };
    });

    const bgStyles = {
      studio: 'radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 75%)',
      light: 'radial-gradient(circle at 50% 35%, #f8fafc 0%, #cbd5e1 85%)',
      pitch: 'radial-gradient(circle at 50% 40%, #14532d 0%, #052e16 80%)',
      chroma: '#00b140',
    };
    document.querySelectorAll('[data-bg]').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('[data-bg]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentBg = btn.dataset.bg;
        document.body.style.background = bgStyles[currentBg];
      };
    });

    // Grabador automático de Showreel (.webm) recorriendo los 11 jugadores
    const btnShowreel = document.getElementById('btn-showreel');
    let showreel = {
      active: false,
      recorder: null,
      canvas: null,
      ctx: null,
      modelIdx: 0,
      modelStart: 0,
      durationMs: 4200,
      prevIndex: 0,
    };

    function drawRecordBg(rCtx, w, h) {
      if (currentBg === 'chroma') {
        rCtx.fillStyle = '#00b140';
        rCtx.fillRect(0, 0, w, h);
        return;
      }
      const grad = rCtx.createRadialGradient(w * 0.5, h * 0.35, 10, w * 0.5, h * 0.45, Math.max(w, h) * 0.65);
      if (currentBg === 'light') {
        grad.addColorStop(0, '#f8fafc');
        grad.addColorStop(1, '#cbd5e1');
      } else if (currentBg === 'pitch') {
        grad.addColorStop(0, '#14532d');
        grad.addColorStop(1, '#052e16');
      } else {
        grad.addColorStop(0, '#1e293b');
        grad.addColorStop(1, '#090d16');
      }
      rCtx.fillStyle = grad;
      rCtx.fillRect(0, 0, w, h);
    }

    function stopShowreel() {
      if (!showreel.active) return;
      showreel.active = false;
      if (showreel.recorder && showreel.recorder.state !== 'inactive') {
        showreel.recorder.stop();
      }
      btnShowreel.classList.remove('active');
      btnShowreel.textContent = '🎥 Grabar Showreel';
      selectPlayer(showreel.prevIndex);
    }

    btnShowreel.onclick = async () => {
      if (showreel.active) {
        stopShowreel();
        return;
      }
      btnShowreel.textContent = '⏳ Precargando...';
      for (const p of players) {
        await ensurePlayerLoaded(p);
      }

      const recCanvas = document.createElement('canvas');
      recCanvas.width = 1280;
      recCanvas.height = 720;
      const recCtx = recCanvas.getContext('2d');

      const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) =>
        MediaRecorder.isTypeSupported(m)
      ) || 'video/webm';

      const stream = recCanvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'football3d_showreel_360.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      };

      showreel.prevIndex = currentIndex;
      showreel.canvas = recCanvas;
      showreel.ctx = recCtx;
      showreel.recorder = recorder;
      showreel.modelIdx = 0;
      showreel.modelStart = performance.now();
      showreel.active = true;

      await selectPlayer(0);
      btnShowreel.classList.add('active');
      btnShowreel.textContent = `⏹ Grabando (1/${players.length})`;
      recorder.start(100);
    };

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') document.body.classList.toggle('clean-mode');
      if (e.key.toLowerCase() === 's') btnSmooth.click();
      if (e.key.toLowerCase() === 'w') btnWire.click();
      if (e.code === 'Space') {
        e.preventDefault();
        btnRotate.click();
      }
    });

    let lastTime = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (showreel.active) {
        const elapsed = now - showreel.modelStart;
        const t = Math.min(1, elapsed / showreel.durationMs);
        const frameIdx = Math.floor(t * 24) % 24;
        const modeOverride = (t >= 0.70 && t <= 0.90) ? 'wire' : (smoothMode ? 'smooth' : 'flat');

        currentFrame = frameIdx;
        drawCurrentFrame(ctx, canvas.width, canvas.height, frameIdx, modeOverride);

        const w = showreel.canvas.width;
        const h = showreel.canvas.height;
        const rCtx = showreel.ctx;
        drawRecordBg(rCtx, w, h);

        const size = Math.min(w, h) * 0.88;
        rCtx.drawImage(canvas, (w - size) / 2, (h - size) / 2, size, size);

        const p = players[showreel.modelIdx];
        if (p) {
          rCtx.save();
          rCtx.font = '700 28px Inter, system-ui, sans-serif';
          rCtx.fillStyle = currentBg === 'light' ? '#0f172a' : '#f1f5f9';
          rCtx.fillText(p.name.toUpperCase(), 36, h - 54);
          rCtx.font = '500 16px Inter, system-ui, sans-serif';
          rCtx.fillStyle = currentBg === 'light' ? '#475569' : '#94a3b8';
          const tag = modeOverride === 'wire' ? 'Topología 3D (Wireframe)' : 'Football 3D Studio · Hunyuan3D 2.0';
          rCtx.fillText(tag, 36, h - 28);
          rCtx.restore();
        }

        if (elapsed >= showreel.durationMs) {
          showreel.modelIdx++;
          if (showreel.modelIdx >= players.length) {
            stopShowreel();
          } else {
            currentIndex = showreel.modelIdx;
            renderPlayerList();
            document.getElementById('active-name').textContent = players[currentIndex].name;
            showreel.modelStart = now;
            btnShowreel.textContent = `⏹ Grabando (${showreel.modelIdx + 1}/${players.length})`;
          }
        }
        return;
      }

      if (autoRotate && !isDragging && players.length > 0) {
        currentFrame = (currentFrame + dt * 6 * rotateSpeed) % 24;
        drawCurrentFrame();
      }
    }

    fetch('players.json')
      .then((r) => r.json())
      .then(async (data) => {
        players = data;
        if (players.length > 0) {
          await selectPlayer(0);
        }
        requestAnimationFrame(tick);
      });
  </script>
</body>
</html>
